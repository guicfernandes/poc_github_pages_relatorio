<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRE Natura 2026 — Relatório de Desempenho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e29;
    --border: rgba(255,255,255,0.07);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --amber: #fbbf24;
    --amber-dim: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.12);
    --text: #e8e8e8;
    --text-dim: #7a7f8e;
    --accent: #a78bfa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    padding: 48px 48px 0;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(167,139,250,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 40px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), #60a5fa);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .brand-text {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #fff;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-meta {
    text-align: right;
  }
  .header-period {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-date {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ─── STORE TABS ─── */
  .store-nav {
    display: flex;
    gap: 4px;
    padding: 0 48px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .store-nav::-webkit-scrollbar { display: none; }
  .store-tab {
    padding: 12px 22px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.3px;
  }
  .store-tab:hover { color: var(--text); }
  .store-tab.active {
    color: #fff;
    border-bottom-color: var(--accent);
  }

  /* ─── MONTH FILTER ─── */
  .month-filter {
    display: flex;
    gap: 6px;
    padding: 0 48px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .month-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .month-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .month-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ─── MAIN LAYOUT ─── */
  main {
    padding: 0 48px 80px;
  }

  /* ─── KPI GRID ─── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .kpi-card:hover {
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-1px);
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .kpi-card.green::before { background: linear-gradient(90deg, var(--green), transparent); }
  .kpi-card.amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
  .kpi-card.blue::before { background: linear-gradient(90deg, var(--blue), transparent); }
  .kpi-card.purple::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .kpi-card.red::before { background: linear-gradient(90deg, var(--red), transparent); }

  .kpi-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .kpi-value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .kpi-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .kpi-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .kpi-badge.up { background: var(--green-dim); color: var(--green); }
  .kpi-badge.down { background: var(--red-dim); color: var(--red); }
  .kpi-badge.neutral { background: var(--blue-dim); color: var(--blue); }

  /* ─── CHARTS ROW ─── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .charts-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: relative;
  }
  .chart-title {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }
  .chart-container {
    position: relative;
    height: 220px;
  }
  .chart-container-lg {
    position: relative;
    height: 280px;
  }

  /* ─── DRE TABLE ─── */
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .section-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .dre-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .dre-table thead th {
    text-align: right;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .dre-table thead th:first-child { text-align: left; }
  .dre-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }
  .dre-table tbody tr:hover { background: rgba(255,255,255,0.02); }
  .dre-table tbody td {
    padding: 9px 14px;
    text-align: right;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .dre-table tbody td:first-child {
    text-align: left;
    color: var(--text);
    font-weight: 400;
  }
  .dre-table tr.group-header td {
    padding-top: 18px;
    padding-bottom: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: none;
  }
  .dre-table tr.total-row td {
    font-weight: 600;
    color: #fff;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding-top: 12px;
    padding-bottom: 12px;
  }
  .dre-table tr.resultado-row td {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    border-top: 2px solid var(--accent);
    padding-top: 14px;
    padding-bottom: 14px;
  }
  .value-positive { color: var(--green) !important; }
  .value-negative { color: var(--red) !important; }
  .pct-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }
  .pct-green { background: var(--green-dim); color: var(--green); }
  .pct-amber { background: var(--amber-dim); color: var(--amber); }
  .pct-red { background: var(--red-dim); color: var(--red); }

  /* ─── WATERFALL CONTAINER ─── */
  .waterfall-wrap {
    margin-bottom: 20px;
  }

  /* ─── DESPESAS BREAKDOWN ─── */
  .desp-bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 8px;
  }
  .desp-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .desp-label {
    font-size: 12px;
    color: var(--text-dim);
    width: 130px;
    flex-shrink: 0;
    letter-spacing: 0.2px;
  }
  .desp-bar-wrap {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .desp-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }
  .desp-val {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    width: 90px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .desp-pct {
    font-size: 11px;
    color: var(--text-dim);
    width: 42px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ─── MULTI-STORE COMPARISON ─── */
  .comparison-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .cmp-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    transition: border-color 0.2s;
  }
  .cmp-card:hover { border-color: rgba(255,255,255,0.15); }
  .cmp-store-id {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .cmp-metric {
    margin-bottom: 10px;
  }
  .cmp-metric-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 2px;
    letter-spacing: 0.3px;
  }
  .cmp-metric-val {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .cmp-pct-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  /* ─── FOOTER ─── */
  footer {
    margin-top: 60px;
    padding: 24px 48px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-left {
    font-size: 12px;
    color: var(--text-dim);
  }
  .footer-right {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }

  /* ─── UTILITY ─── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 40px 0;
  }
  .flex-between {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 900px) {
    header, .store-nav, .month-filter, main { padding-left: 20px; padding-right: 20px; }
    .charts-row, .charts-row-3 { grid-template-columns: 1fr; }
    .comparison-grid { grid-template-columns: 1fr 1fr; }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 500px) {
    .kpi-grid, .comparison-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 22px; }
  }
</style>
</head>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = v => v === 0 ? '—' : 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtShort = v => {
  if (v >= 1e6) return 'R$ ' + (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return 'R$ ' + (v/1e3).toFixed(0) + 'K';
  return 'R$ ' + v.toFixed(0);
};
const fmtPct = v => v.toFixed(1) + '%';
const sum = arr => arr.reduce((a,b) => a+b, 0);

function getMetric(storeId, metric, monthIdx) {
  const d = DATA[storeId];
  if (monthIdx === 'all') return sum(d[metric].slice(0,3));
  return d[metric][monthIdx] || 0;
}

function getAllStores(metric, monthIdx) {
  return Object.keys(DATA).reduce((a,s) => a + getMetric(s, metric, monthIdx), 0);
}

function pctBadge(pct) {
  const cls = pct >= 20 ? 'pct-green' : pct >= 10 ? 'pct-amber' : 'pct-red';
  return `<span class="pct-badge ${cls}">${fmtPct(pct)}</span>`;
}

function deltaPct(a, b) {
  if (b === 0) return null;
  return ((a - b) / Math.abs(b) * 100).toFixed(1);
}

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

function baseOptions(opts = {}) {

        {
          label: 'Receita Bruta',
          data: ACTIVE_MONTHS.map(i => d.receita_bruta[i]),
          backgroundColor: CHART_COLORS.blue + '55',
          borderColor: CHART_COLORS.blue,
          borderWidth: 1.5,
          borderRadius: 4,
          yAxisID: 'y',
        },
        {
          label: 'Margem Bruta',
          data: ACTIVE_MONTHS.map(i => d.margem_bruta[i]),
          backgroundColor: CHART_COLORS.green + '55',
          borderColor: CHART_COLORS.green,
          borderWidth: 1.5,
          borderRadius: 4,
          yAxisID: 'y',
        },
        {
          label: 'Resultado',
          type: 'line',
          data: ACTIVE_MONTHS.map(i => d.resultado[i]),
          borderColor: CHART_COLORS.amber,
          backgroundColor: CHART_COLORS.amber + '20',
          borderWidth: 2.5,
          pointRadius: 5,
          pointBackgroundColor: CHART_COLORS.amber,
          tension: 0.3,
          fill: true,
          yAxisID: 'y',
        }
      ]
    },
    options: {
      ...baseOptions(),
      plugins: { ...baseOptions().plugins, legend: { display: true, labels: { color: '#9ca3af', boxWidth: 12 } } }
    }
  });

  // Chart: Waterfall
  const wfLabels = ['Rec. Bruta','Descontos','Impostos','CMV','Royalties + FP','Desp. Oper.','Resultado'];
  const wfValues = [rb, -desc, -imp, -cmv, -(roy+fp+pe), -dt, res];
  const wfColors = wfValues.map((v,i) => i === 0 ? CHART_COLORS.blue + 'cc' : i === wfValues.length-1 ? (v>=0?CHART_COLORS.green:CHART_COLORS.red)+'cc' : CHART_COLORS.red+'99');
  const wfCtx = document.getElementById('chartWaterfall').getContext('2d');
  charts.wf = new Chart(wfCtx, {
    type: 'bar',
    data: {
      labels: wfLabels,
      datasets: [{
        data: wfValues.map(Math.abs),
        backgroundColor: wfColors,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: { ...baseOptions(), plugins: { ...baseOptions().plugins, tooltip: { callbacks: { label: ctx => (wfValues[ctx.dataIndex] < 0 ? '  −' : '  ') + fmtShort(Math.abs(wfValues[ctx.dataIndex])) } } } }
  });

  // Desp bars
  const despItems = [
    { label: 'Pessoal', val: dp, color: CHART_COLORS.blue },
    { label: 'Ocupação', val: do_, color: CHART_COLORS.amber },
    { label: 'Despesas de Vendas', val: dv, color: CHART_COLORS.green },
    { label: 'Diversas', val: dd, color: CHART_COLORS.purple },
  ];
  const maxDesp = Math.max(...despItems.map(x => x.val));
  document.getElementById('despBars').innerHTML = despItems.map(item => `
    <div class="desp-row">
      <div class="desp-label">${item.label}</div>
      <div class="desp-bar-wrap">
        <div class="desp-bar" style="width:${maxDesp > 0 ? (item.val/maxDesp*100).toFixed(1) : 0}%;background:${item.color}"></div>
      </div>
      <div class="desp-val">${fmt(item.val)}</div>
      <div class="desp-pct">${dt > 0 ? fmtPct(item.val/dt*100) : '—'}</div>
    </div>
  `).join('');

  // Chart: % resultado por mês
  const resPctCtx = document.getElementById('chartResPct').getContext('2d');
  charts.resPct = new Chart(resPctCtx, {
    type: 'line',
    data: {
      labels: ACTIVE_MONTHS.map(i => MONTHS[i]),
      datasets: [
        {
          label: '% Margem Bruta',
          data: ACTIVE_MONTHS.map(i => d.margem_bruta_pct[i]),
          borderColor: CHART_COLORS.green,
          backgroundColor: CHART_COLORS.green + '15',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: CHART_COLORS.green,
          tension: 0.3,
          fill: false,
        },
        {
          label: '% Resultado',
          data: ACTIVE_MONTHS.map(i => d.resultado_pct[i]),
          borderColor: CHART_COLORS.amber,
          backgroundColor: CHART_COLORS.amber + '15',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: CHART_COLORS.amber,
          tension: 0.3,
          fill: false,
        }
      ]
    },
    options: {
      ...baseOptions({ scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a7f8e' }, border: { color: 'rgba(255,255,255,0.08)' } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a7f8e', callback: v => v + '%' }, border: { color: 'rgba(255,255,255,0.08)' } },
      }}),
      plugins: {
        ...baseOptions().plugins,
        legend: { display: true, labels: { color: '#9ca3af', boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => '  ' + ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%' } },
      }
    }
  });
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function setStore(id) {
  currentStore = id;
  document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setMonth(m) {
  currentMonth = m;
  document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  destroyCharts();
  if (currentStore === 'all') renderOverview();
  else renderStore(currentStore);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
